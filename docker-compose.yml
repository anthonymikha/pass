services:
  db:
    image: postgres:18
    restart: unless-stopped  # back after a reboot or a crash
    env_file: .env
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage for recordings and avatars (REC-1): SeaweedFS with its S3 API, one bucket, data in ./data/storage.
  # The access keys come from .env; the S3 identity file is written at start so no secret is committed.
  storage:
    image: chrislusf/seaweedfs:4.52
    restart: unless-stopped  # back after a reboot or a crash
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - printf '{"identities":[{"name":"pass","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY" > /tmp/s3.json
        && exec weed server -dir=/data -ip=storage -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - ./data/storage:/data
    ports:
      - "${STORAGE_PORT:-9000}:8333"  # what phones reach: STORAGE_PUBLIC_ENDPOINT must use this host port

  # One-shot: waits for storage, then creates the bucket if it is missing (safe to run again).
  storage-init:
    image: chrislusf/seaweedfs:4.52
    env_file: .env
    depends_on:
      - storage
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - until echo "s3.bucket.list" | weed shell -master=storage:9333 >/dev/null 2>&1; do sleep 1; done;
        echo "s3.bucket.list" | weed shell -master=storage:9333 | grep -q "^  $$STORAGE_BUCKET[[:space:]]" ||
        echo "s3.bucket.create -name $$STORAGE_BUCKET" | weed shell -master=storage:9333

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped  # back after a reboot or a crash
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8000}:8000"  # host port; set BACKEND_PORT in .env if 8000 is taken
    # Healthy once migrations ran and gunicorn answers: the public club search reads the database. Host is PASS_HOST,
    # which ALLOWED_HOSTS accepts.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen(u.Request('http://localhost:8000/api/clubs/', headers={'Host': os.environ.get('PASS_HOST', 'localhost')}), timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  # NOTE-30: one `manage.py tick` a minute (billing, RPE reminders). Same image as the backend; never migrates (the
  # backend does), so it starts only once the backend is healthy.
  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped  # back after a reboot or a crash
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["sh", "-c", "while true; do python manage.py tick; sleep 60; done"]

  # Nightly database backup (docs/deployment.md): checks every hour and makes today's dump (UTC date) once, so a night
  # the server was down is caught up at the next start. Dumps older than 7 days are removed. Video is not backed up.
  backup:
    image: postgres:18
    restart: unless-stopped  # back after a reboot or a crash
    env_file: .env
    environment:
      PGHOST: db
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - while true; do
          f=/backups/pass-$$(date -u +%F).dump;
          [ -f "$$f" ] || { PGPASSWORD="$$POSTGRES_PASSWORD" pg_dump -U "$$POSTGRES_USER" -Fc -f "$$f.part" "$$POSTGRES_DB" && mv "$$f.part" "$$f"; };
          find /backups -name 'pass-*.dump' -mtime +6 -delete;
          sleep 3600;
        done
    volumes:
      - ./data/backups:/backups

# All container data lives under ./data (gitignored), never in named volumes.
