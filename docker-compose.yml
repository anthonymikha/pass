services:
  db:
    image: postgres:18
    env_file: .env
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage for recordings and avatars (REC-1): SeaweedFS with its S3 API, one bucket, data in ./data/storage.
  # The access keys come from .env; the S3 identity file is written at start so no secret is committed.
  storage:
    image: chrislusf/seaweedfs:4.52
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - printf '{"identities":[{"name":"pass","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY" > /tmp/s3.json
        && exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - ./data/storage:/data
    ports:
      - "${STORAGE_PORT:-9000}:8333"  # what phones reach: STORAGE_PUBLIC_ENDPOINT must use this host port

  # One-shot: waits for storage, then creates the bucket if it is missing (safe to run again).
  storage-init:
    image: chrislusf/seaweedfs:4.52
    env_file: .env
    depends_on:
      - storage
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - until echo "s3.bucket.list" | weed shell -master=storage:9333 >/dev/null 2>&1; do sleep 1; done;
        echo "s3.bucket.list" | weed shell -master=storage:9333 | grep -q "^  $$STORAGE_BUCKET[[:space:]]" ||
        echo "s3.bucket.create -name $$STORAGE_BUCKET" | weed shell -master=storage:9333

  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8000}:8000"  # host port; set BACKEND_PORT in .env if 8000 is taken

  # NOTE-30: one `manage.py tick` a minute (RPE reminders). Same image as the backend; never migrates (the backend does).
  scheduler:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    command: ["sh", "-c", "while true; do python manage.py tick; sleep 60; done"]

  # Flutter web build goes here later: a reverse proxy serving the web build at /
  # and forwarding /api/, /admin/ and /static/ to backend:8000 (same origin, no CORS).
  # web:
  #   build: ./frontend
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - backend

# All container data lives under ./data (gitignored), never in named volumes.
