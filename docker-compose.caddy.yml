# Production on a server with no reverse proxy (docs/deployment.md):
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
# Caddy takes ports 80 and 443, gets the certificates itself (data in ./data/caddy) and forwards PASS_HOST to the
# backend and FILES_HOST to storage, keeping the Host header (signed storage links depend on it).
services:
  backend:
    ports: !reset []

  storage:
    ports: !reset []

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - ./data/caddy:/data
    depends_on:
      - backend
      - storage

configs:
  caddyfile:
    content: |
      ${PASS_HOST} {
        reverse_proxy backend:8000
      }
      ${FILES_HOST} {
        reverse_proxy storage:8333
      }
